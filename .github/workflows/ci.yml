name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Check required environment variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node -e "const required=['DATABASE_URL','GEMINI_API_KEY','ADMIN_PASSWORD']; const missing=required.filter(k=>!process.env[k]||process.env[k]===''); if(missing.length){console.error('Missing required env vars:',missing.join(', ')); process.exit(1);}"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  migrate-production:
    name: Apply production database migrations
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.POSTGRES_URL_NON_POOLING != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Apply migrations
        run: |
          npx prisma migrate resolve --applied 20260828000000_baseline || true
          npx prisma migrate deploy
