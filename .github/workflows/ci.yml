name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit

  migrate-production:
    name: Apply production database migrations
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.POSTGRES_URL_NON_POOLING != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Apply migrations
        run: |
          npx prisma migrate resolve --applied 20260828000000_baseline || true
          npx prisma migrate deploy
